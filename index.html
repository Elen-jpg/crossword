<!DOCTYPE html>
<html lang="ka">
<head>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }
    body {
      background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
      color: #333;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }
    
    .top-nav {
      width: 100%;
      max-width: 950px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
    }
    .lang-switcher {
      display: flex;
      gap: 8px;
      background: rgba(255, 255, 255, 0.2);
      padding: 4px;
      border-radius: 20px;
      backdrop-filter: blur(5px);
    }
    .lang-btn {
      border: none;
      background: transparent;
      color: white;
      padding: 6px 14px;
      font-weight: bold;
      border-radius: 16px;
      cursor: pointer;
      transition: all 0.3s;
    }
    .lang-btn.active {
      background: #f39c12;
      color: white;
      box-shadow: 0 2px 8px rgba(0,0,0,0.2);
    }

    header {
      text-align: center;
      color: white;
      margin-bottom: 25px;
    }
    h1 {
      font-size: 2.3rem;
      margin-bottom: 8px;
      text-shadow: 0 2px 4px rgba(0,0,0,0.3);
    }
    p.subtitle {
      font-size: 1.1rem;
      opacity: 0.9;
    }

    .screen {
      width: 100%;
      max-width: 950px;
      background: white;
      padding: 35px;
      border-radius: 16px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.25);
      animation: fadeIn 0.4s ease-in-out;
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .hidden {
      display: none !important;
    }

    /* Topics Grid */
    .topics-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
      gap: 15px;
      margin-top: 20px;
    }
    .topic-card {
      background: #f8fafc;
      border: 2px solid #e2e8f0;
      border-radius: 12px;
      padding: 18px 15px;
      text-align: left;
      font-weight: bold;
      font-size: 1.05rem;
      color: #1e293b;
      cursor: pointer;
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .topic-card .title-group {
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .topic-card .icon {
      font-size: 1.5rem;
    }
    .topic-card .badge {
      background: #1e293b;
      color: white;
      font-size: 0.75rem;
      padding: 4px 8px;
      border-radius: 6px;
    }
    .topic-card:hover {
      background: #3b82f6;
      color: white;
      border-color: #2563eb;
      transform: translateY(-3px);
      box-shadow: 0 8px 20px rgba(59, 130, 246, 0.25);
    }
    .topic-card:hover .badge {
      background: white;
      color: #1e293b;
    }

    /* Game Controls */
    .game-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 25px;
      border-bottom: 2px solid #f1f5f9;
      padding-bottom: 15px;
      flex-wrap: wrap;
      gap: 10px;
    }
    .btn {
      background: #3b82f6;
      color: white;
      border: none;
      padding: 10px 22px;
      font-size: 1rem;
      border-radius: 8px;
      cursor: pointer;
      font-weight: bold;
      transition: all 0.2s;
      box-shadow: 0 4px 10px rgba(59, 130, 246, 0.2);
    }
    .btn:hover {
      background: #2563eb;
      transform: translateY(-1px);
    }
    .btn-secondary {
      background: #64748b;
      box-shadow: 0 4px 10px rgba(100, 116, 139, 0.2);
    }
    .btn-secondary:hover {
      background: #475569;
    }

    /* Quiz Questions */
    .quiz-container {
      display: flex;
      flex-direction: column;
      gap: 20px;
    }
    .question-item {
      background: #f8fafc;
      border-left: 5px solid #3b82f6;
      padding: 18px 22px;
      border-radius: 8px;
      box-shadow: 0 2px 5px rgba(0,0,0,0.03);
    }
    .question-text {
      font-weight: 600;
      margin-bottom: 12px;
      font-size: 1.1rem;
      color: #1e293b;
    }
    .input-answer {
      width: 100%;
      max-width: 350px;
      padding: 10px 14px;
      font-size: 1rem;
      border: 2px solid #cbd5e1;
      border-radius: 6px;
      outline: none;
      transition: border 0.2s;
    }
    .input-answer:focus {
      border-color: #3b82f6;
    }
    .input-answer.correct {
      border-color: #10b981;
      background-color: #ecfdf5;
      color: #065f46;
      font-weight: bold;
    }
    .input-answer.incorrect {
      border-color: #ef4444;
      background-color: #fef2f2;
      color: #991b1b;
    }

    .score-board {
      margin-top: 30px;
      padding: 20px;
      background: #e0f2fe;
      border-radius: 10px;
      text-align: center;
      font-size: 1.4rem;
      font-weight: bold;
      color: #0369a1;
      animation: fadeIn 0.3s ease;
    }
  </style>
</head>

    function setLanguage(lang) {
      currentLang = lang;
      document.getElementById('btn-ka').classList.toggle('active', lang === 'ka');
      document.getElementById('btn-en').classList.toggle('active', lang === 'en');
      
      document.getElementById('app-title').innerText = i18n[lang].title;
      document.getElementById('app-subtitle').innerText = i18n[lang].subtitle;
      document.getElementById('select-topic-txt').innerText = i18n[lang].selectTopic;
      document.getElementById('back-btn').innerText = i18n[lang].backBtn;
      document.getElementById('refresh-btn').innerText = i18n[lang].refreshBtn;
      document.getElementById('check-btn').innerText = i18n[lang].checkBtn;

      initTopics();
      if (selectedTopic) {
        document.getElementById('current-topic-title').innerText = selectedTopic.title[currentLang];
        startNewGame();
      }
    }

    function initTopics() {
      const grid = document.getElementById('topics-grid');
      grid.innerHTML = '';
      quizData.forEach(topic => {
        const card = document.createElement('div');
        card.className = 'topic-card';
        card.innerHTML = `
          <div class="title-group">
            <span class="icon">${topic.icon}</span> 
            <span>${topic.title[currentLang]}</span>
          </div>
          <span class="badge">${i18n[currentLang].badgeText}</span>
        `;
        card.onclick = () => selectTopic(topic);
        grid.appendChild(card);
      });
    }

    function selectTopic(topic) {
      selectedTopic = topic;
      document.getElementById('topics-screen').classList.add('hidden');
      document.getElementById('game-screen').classList.remove('hidden');
      document.getElementById('current-topic-title').innerText = topic.title[currentLang];
      startNewGame();
    }

    function showTopics() {
      selectedTopic = null;
      document.getElementById('game-screen').classList.add('hidden');
      document.getElementById('topics-screen').classList.remove('hidden');
    }

    function startNewGame() {
      document.getElementById('score-board').classList.add('hidden');
      const shuffled = [...selectedTopic.questions].sort(() => 0.5 - Math.random());
      currentQuestions = shuffled.slice(0, 10);

      const container = document.getElementById('quiz-container');
      container.innerHTML = '';

      currentQuestions.forEach((item, index) => {
        const div = document.createElement('div');
        div.className = 'question-item';
        div.innerHTML = `
          <div class="question-text">${index + 1}. ${item.q[currentLang]}</div>
          <input type="text" class="input-answer" id="ans-${index}" placeholder="${i18n[currentLang].placeholder}" autocomplete="off">
        `;
        container.appendChild(div);
      });
    }

    function checkAnswers() {
      let score = 0;
      currentQuestions.forEach((item, index) => {
        const input = document.getElementById(`ans-${index}`);
        const userAns = input.value.trim().toLowerCase();
        const correctAns = item.a[currentLang].toLowerCase();

        if (userAns === correctAns) {
          input.className = "input-answer correct";
          score++;
        } else {
          input.className = "input-answer incorrect";
          input.value = `${input.value} (${i18n[currentLang].correctText}: ${item.a[currentLang]})`;
        }
      });

      const scoreBoard = document.getElementById('score-board');
      scoreBoard.innerText = `${i18n[currentLang].scoreText} ${score} / ${currentQuestions.length}`;
      scoreBoard.classList.remove('hidden');
    }

    initTopics();
  </script>
